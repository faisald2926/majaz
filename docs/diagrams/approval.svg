<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t"><title id="t">دورة الموافقة البشرية في مجاز</title><rect width="1000" height="400" rx="24" fill="#f5f7fa"/><g font-family="Tahoma,Arial" text-anchor="middle" fill="#142b47"><text x="500" y="60" font-size="27" font-weight="bold">كل معرفة تعبر من مراجعة بشرية</text><g font-size="20"><rect x="735" y="130" width="220" height="120" rx="18" fill="#fff5df"/><text x="845" y="175">إضافة أو استيراد</text><text x="845" y="212" font-size="16">قيد المراجعة دائمًا</text><rect x="385" y="130" width="230" height="120" rx="18" fill="#edf3fd"/><text x="500" y="175">مراجعة النسخة</text><text x="500" y="212" font-size="16">العنوان والنص والسياق والعمر</text><rect x="45" y="130" width="220" height="120" rx="18" fill="#e8f6ef"/><text x="155" y="175">معتمدة حاليًا</text><text x="155" y="212" font-size="16">تظهر في بحث الطفل وقراءته</text></g><text x="500" y="335" font-size="18">التغيير المؤثر أو الإبطال يعيد البطاقة للمراجعة · لا موافقة تلقائية من AI</text></g><g stroke="#3567ce" stroke-width="3" fill="none"><path d="M735 190H630M635 183L625 190L635 197M385 190H280M285 183L275 190L285 197"/><path d="M155 255V285H845V255" stroke="#bd8c36" stroke-dasharray="7 5"/></g></svg>
