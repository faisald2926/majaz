<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t"><title id="t">أثر تغيير محتوى النص المترابط والبطاقات المستقلة</title><rect width="1000" height="480" rx="24" fill="#f5f7fa"/><g font-family="Tahoma,Arial" text-anchor="middle" fill="#142b47"><text x="500" y="55" font-size="27" font-weight="bold">الموافقة ترافق المعنى والسياق</text><rect x="525" y="100" width="425" height="265" rx="20" fill="white" stroke="#e4e9ef"/><rect x="50" y="100" width="425" height="265" rx="20" fill="white" stroke="#e4e9ef"/><text x="737" y="142" font-size="22">نص مترابط · الوضع الافتراضي</text><text x="262" y="142" font-size="22">بطاقات مستقلة · بتصريح الوالد</text><g font-size="19"><rect x="795" y="178" width="100" height="72" rx="12" fill="#fff5df"/><text x="845" y="220">بطاقة أ</text><rect x="685" y="178" width="100" height="72" rx="12" fill="#fff5df"/><text x="735" y="220">بطاقة ب</text><rect x="575" y="178" width="100" height="72" rx="12" fill="#fff5df"/><text x="625" y="220">بطاقة ج</text><rect x="320" y="178" width="100" height="72" rx="12" fill="#fff5df"/><text x="370" y="220">بطاقة أ</text><rect x="210" y="178" width="100" height="72" rx="12" fill="#e8f6ef"/><text x="260" y="220">بطاقة ب</text><rect x="100" y="178" width="100" height="72" rx="12" fill="#e8f6ef"/><text x="150" y="220">بطاقة ج</text></g><text x="737" y="300" font-size="17">تعديل بطاقة أو ترتيب: الجميع بحاجة لمراجعة</text><text x="262" y="300" font-size="17">تعديل أ: موافقة ب وج تبقى إذا لم يتغير سياقهما</text><text x="737" y="332" font-size="15" fill="#6a7b8e">السياق يشمل عنوان المصدر وكل المقاطع وترتيبها</text><text x="262" y="332" font-size="15" fill="#6a7b8e">التصريح مسؤولية الوالد؛ لا يفحصه AI</text><text x="500" y="422" font-size="18">تغيير العمر أو السياسة أو عنوان المصدر يبطل جميع الموافقات المتأثرة</text></g></svg>
